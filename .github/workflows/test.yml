name: Test
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Install WinFsp SDK
        shell: pwsh
        run: |
          $version = "2.1"
          $build = "25054"
          $url = "https://github.com/winfsp/winfsp/releases/download/v${version}/winfsp-${version}.${build}.msi"
          Invoke-WebRequest -Uri $url -OutFile "$env:TEMP\winfsp.msi"
          Start-Process msiexec.exe -Wait -ArgumentList "/i", "$env:TEMP\winfsp.msi", "/qn"

      - name: Unit Tests
        env:
          CGO_ENABLED: 1
          CPATH: "C:\\Program Files (x86)\\WinFsp\\inc\\fuse"
        run: go test ./... -v -count=1 -short -timeout 60s

      - name: Integration Tests
        env:
          CGO_ENABLED: 1
          CPATH: "C:\\Program Files (x86)\\WinFsp\\inc\\fuse"
        run: go test ./... -v -count=1 -run Integration -timeout 120s

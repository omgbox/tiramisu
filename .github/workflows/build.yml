name: Build
on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Install WinFsp SDK
        shell: pwsh
        run: |
          $version = "2.1"
          $build = "25156"
          $url = "https://github.com/winfsp/winfsp/releases/download/v${version}/winfsp-${version}.${build}.msi"
          Write-Host "Downloading WinFsp SDK from $url"
          Invoke-WebRequest -Uri $url -OutFile "$env:TEMP\winfsp.msi"
          Write-Host "Installing WinFsp SDK..."
          Start-Process msiexec.exe -Wait -ArgumentList "/i", "$env:TEMP\winfsp.msi", "/qn", "ADDLOCAL=ALL", "/l*v", "$env:TEMP\winfsp.log"
          Get-ChildItem "C:\Program Files (x86)\WinFsp" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 20
          if (Test-Path "C:\Program Files (x86)\WinFsp\inc\fuse\fuse.h") {
            Write-Host "WinFsp SDK installed successfully"
          } else {
            Write-Error "WinFsp headers not found at C:\Program Files (x86)\WinFsp\inc\fuse\fuse.h"
            Get-Content "$env:TEMP\winfsp.log" | Select-Object -Last 50
            exit 1
          }

      - name: Tidy modules
        env:
          CGO_ENABLED: 1
          CPATH: "C:\\Program Files (x86)\\WinFsp\\inc\\fuse"
        run: go mod tidy

      - name: Download WinFsp DLL for embedding
        shell: pwsh
        run: |
          $dllUrl = "https://github.com/winfsp/winfsp/releases/download/v2.1/winfsp-2.1.25156.msi"
          Write-Host "Extracting winfsp-x64.dll from WinFsp installer..."
          $msiPath = "$env:TEMP\winfsp-dll.msi"
          # Reuse already-downloaded MSI if present
          if (-not (Test-Path $msiPath)) {
            Invoke-WebRequest -Uri $dllUrl -OutFile $msiPath
          }
          # Extract DLL from MSI
          $extractDir = "$env:TEMP\winfsp-dll"
          Start-Process msiexec.exe -Wait -ArgumentList "/a", $msiPath, "/qn", "/l*v", "$env:TEMP\winfsp-dll.log"
          # Find the DLL
          $dll = Get-ChildItem "C:\Program Files (x86)\WinFsp\bin\winfsp-x64.dll" -ErrorAction SilentlyContinue
          if ($dll) {
            Copy-Item $dll.FullName "internal\winfsp\winfsp-x64.dll" -Force
            Write-Host "Copied winfsp-x64.dll to internal/winfsp/ ($($dll.Length) bytes)"
          } else {
            Write-Error "winfsp-x64.dll not found after install"
            exit 1
          }

      - name: Build
        env:
          CGO_ENABLED: 1
          GOOS: windows
          GOARCH: amd64
          CPATH: "C:\\Program Files (x86)\\WinFsp\\inc\\fuse"
          CGO_LDFLAGS: "-static"
          GOFLAGS: "-tags=disable_libutp,noboltdb"
        run: |
          $commit = (git rev-parse --short HEAD)
          $date = (Get-Date -Format "yyyy-MM-dd")
          $ldflags = "-s -w -extldflags '-static' -X main.version=ci -X main.commit=$commit -X main.date=$date -trimpath"
          go build -o bittorrentfs.exe -ldflags="$ldflags" -tags="disable_libutp,noboltdb" .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host "Build successful (commit=$commit, date=$date)"

      - name: Compress with UPX
        shell: pwsh
        run: |
          $url = "https://github.com/upx/upx/releases/download/v4.2.4/upx-4.2.4-win64.zip"
          Invoke-WebRequest -Uri $url -OutFile "$env:TEMP\upx.zip"
          Expand-Archive -Path "$env:TEMP\upx.zip" -DestinationPath "$env:TEMP\upx" -Force
          & "$env:TEMP\upx\upx-4.2.4-win64\upx.exe" -9 --no-progress bittorrentfs.exe
          $size = [math]::Round((Get-Item bittorrentfs.exe).Length / 1MB, 2)
          Write-Host "Compressed binary: $size MB"

      - name: Bundle WinFsp DLL
        shell: pwsh
        run: |
          # Bundle DLL separately for users who don't want auto-extraction
          Copy-Item "C:\Program Files (x86)\WinFsp\bin\winfsp-x64.dll" . -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bittorrentfs-windows-amd64
          path: |
            bittorrentfs.exe
            winfsp-x64.dll
          retention-days: 30

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: bittorrentfs.exe
          generate_release_notes: true
